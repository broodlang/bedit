<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>bedit</title>
  <!-- The app icon: a brood cell (the hexagon) holding a Lisp paren pair with the
       editor's caret between them. Catppuccin Mocha, the editor's own theme:
       a mauve -> blue plate, ink knocked out to the window background (#1e1e2e),
       caret in peach. Installed as-is (nothing is rasterised — the desktop renders
       the SVG at whatever size it needs); see assets/README.md. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cba6f7"/>
      <stop offset="1" stop-color="#89b4fa"/>
    </linearGradient>
  </defs>

  <!-- pointy-top hexagon, centre 128,128, half-height 122 -->
  <polygon fill="url(#plate)"
           points="128,6 233.65,67 233.65,189 128,250 22.35,189 22.35,67"/>

  <!-- The parens. Each is a short span of a LARGE circle centred on the far side of
       the mark — that gentle curvature is what reads as typographic ( ) rather than
       as two halves of a ring. -->
  <g fill="none" stroke="#1e1e2e" stroke-width="17" stroke-linecap="round">
    <path d="M 106.92 183.07 A 91.5 91.5 0 0 1 106.92 72.93"/>
    <path d="M 149.08 72.93 A 91.5 91.5 0 0 1 149.08 183.07"/>
  </g>

  <!-- the caret, between the parens -->
  <rect x="119" y="84" width="18" height="88" rx="9" fill="#fab387"/>
</svg>
