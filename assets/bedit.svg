<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>bedit</title>
  <!-- The app icon: a brood cell (the hexagon) holding two lines of text with the
       editor's caret at the end of the second. Catppuccin Mocha, the editor's own
       theme: a mauve -> blue plate, ink knocked out to the window background
       (#1e1e2e), caret in peach. Installed as-is (nothing is rasterised — the
       desktop renders the SVG at whatever size it needs); see assets/README.md.

       It used to be a Lisp paren pair with the caret between them. Two arcs
       curving toward each other around a vertical bar is an ENCLOSURE, though,
       and an enclosure is what the eye resolves before it resolves punctuation —
       so the parens read as a boundary rather than as a form, and at 16 px they
       fused into one almond with the caret dropping out below it as a separate
       dot. Nothing here encloses anything: horizontal bars are the shape that
       survives smallest, and at every size the mark still reads as text with a
       cursor in it. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cba6f7"/>
      <stop offset="1" stop-color="#89b4fa"/>
    </linearGradient>
  </defs>

  <!-- pointy-top hexagon, centre 128,128, half-height 122 -->
  <polygon fill="url(#plate)"
           points="128,6 233.65,67 233.65,189 128,250 22.35,189 22.35,67"/>

  <!-- Two lines of text. Both start at x=60 because text is left-aligned — that
       shared left edge is what makes them read as lines rather than as a pair of
       bars — and together they sit centred on the plate (94..162, centre 128). -->
  <g fill="#1e1e2e">
    <rect x="60" y="94" width="136" height="21" rx="10.5"/>
    <rect x="60" y="141" width="70" height="21" rx="10.5"/>
  </g>

  <!-- the caret, at the end of the second line and taller than it, the way a
       cursor stands above the text it sits in -->
  <rect x="146" y="132" width="21" height="39" rx="10.5" fill="#fab387"/>
</svg>
