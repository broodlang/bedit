# The build, on every push.
# ^^^^^^^^^^^^^^^^^^^^^^^^^ comment
name: ci
# ^^ symbol
on:
  push:
    branches: [main, "release/*"]
    #                ^^^^^^^^^^^ string
  pull_request: {}

env:
  RETRIES: 3
  #        ^ number
  RATIO: 1.5
  #      ^^^ number
  DEBUG: false
  #      ^^^^^ constant
  CACHE: null
  #      ^^^^ constant

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          make build
          make test
      - name: Report
        if: ${{ failure() }}
        run: echo 'it failed' # a note
        #                     ^^^^^^^^ comment
---
# ^ special
anchors:
  base: &base
    #   ^^^^^ special
    image: alpine
  derived:
    <<: *base
    #   ^^^^^ special
    tag: "3.20"
