name: Release

# Build the standalone `bedit` binary for each supported platform and attach the
# tarballs to a GitHub Release. Triggered by pushing a version tag (`v1.2.3`), or
# manually via workflow_dispatch with a tag name.
#
# bedit is a Brood app: `nest release` bundles its source onto the GUI-enabled `brood`
# runtime embedded in a `nest` built with `--with-gui`. So each job first builds and
# installs a GUI-enabled nest from the brood repo, then runs bedit's `make build`
# (which is `nest release -o bedit`). The binary is native to the runner's arch, so —
# like brood's own release — each target is built on a matching runner.
#
# NOTE: the x86_64-apple-darwin (Intel) job uses the macos-13 runner, whose
# availability on GitHub-hosted runners is limited; if it stalls, re-run the job.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.1.0)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The brood release the GUI nest is built from (kept in step with the toolchain).
  BROOD_TAG: v0.3.0

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
    steps:
      - name: Checkout bedit
        uses: actions/checkout@v4
        with:
          path: bedit

      - name: Checkout brood (for the GUI-enabled nest)
        uses: actions/checkout@v4
        with:
          repository: broodlang/brood
          ref: ${{ env.BROOD_TAG }}
          path: brood

      - name: Install system dependencies (macOS)
        run: brew install cmake

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: brood
          key: bedit-release-${{ matrix.target }}

      # A GUI-enabled nest (its embedded brood runtime carries the native window
      # backend), installed into ~/.local/bin so `nest release` bundles a GUI binary.
      - name: Build + install GUI-enabled nest
        working-directory: brood
        run: |
          ./configure --with-gui
          make install
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # bedit's `make build` is `nest release -o bedit` — a self-contained binary.
      - name: Build bedit
        working-directory: bedit
        run: make build

      - name: Package
        id: package
        shell: bash
        working-directory: bedit
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          name="bedit-${tag}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp bedit "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          ( cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256" )
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          files: |
            bedit/dist/*.tar.gz
            bedit/dist/*.sha256
          fail_on_unmatched_files: true
