name: Release

# Build bedit as a single self-contained executable for Linux and macOS, and attach
# the tarballs to a GitHub Release.
#
# bedit is a Brood app, not a Rust crate, so a "binary" here is `nest release`
# (ADR-038): the project's manifest and every `src/**/*.blsp` appended to a copy of
# the brood runtime. The result runs on any compatible machine with no interpreter,
# no project directory and no sources beside it — one file.
#
# Which means the runtime it is appended to has to be built FIRST, and with the GUI
# backend on (`./configure --with-gui`): bedit opens a window, and the default brood
# build has no window backend at all. That is why this workflow installs X11/Wayland/
# xkbcommon/GL headers on Linux — the runtime links against them, not bedit.
#
# Triggered by a version tag (`v0.2.1`), or manually with a tag name.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.2.1)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          # x86_64-apple-darwin is deliberately absent. `nest release` appends to a
          # runtime for the TARGET and cross-compiling is out of scope (ADR-038) — it
          # would mean cross-building brood on the arm64 runner and passing it via
          # `--runtime`. Doable, but it is a second untested path for a shrinking
          # platform; add it when someone actually needs an Intel Mac build.
    steps:
      - uses: actions/checkout@v4

      # The GUI backend's system libraries. Linux only: macOS gets its window server
      # from the SDK, so nothing to install there.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config git \
            libasound2-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable

      # Pinned to brood `main`, matching what CI checks against — a release built
      # against an older runtime than the one CI proves green would be a different
      # program from the one that was tested.
      - name: Build the brood toolchain with the GUI backend
        run: |
          git clone --depth 1 https://github.com/broodlang/brood.git /tmp/brood
          cd /tmp/brood
          ./configure --prefix="$HOME/.local" --with-gui
          make install

      - name: Bundle bedit
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          nest release -o "bedit-${{ matrix.target }}"
          chmod +x "bedit-${{ matrix.target }}"

      # A smoke check that the bundle is actually runnable, so a broken artifact is
      # caught here rather than by whoever downloads it. `--version` needs no window,
      # which matters on a headless runner.
      - name: Smoke-check the bundle
        run: |
          ./bedit-${{ matrix.target }} --version || \
            BROOD_GUI_HEADLESS=1 ./bedit-${{ matrix.target }} --version

      - name: Package
        run: tar -czf "bedit-${{ matrix.target }}.tar.gz" "bedit-${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: bedit-${{ matrix.target }}
          path: bedit-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          gh release create "$tag" dist/*.tar.gz \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --generate-notes \
            || gh release upload "$tag" dist/*.tar.gz --repo "${{ github.repository }}" --clobber
