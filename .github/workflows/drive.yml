name: Drivers

# The live drivers (tools/drive-*.blsp, tools/README.md): the real editor over a pty, read back
# through std/vt, or its own loop over a scripted frontend — what reaches a command from a key,
# an async reply landing, a buffer really gone from the screen. CI's gate (ci.yml) runs the
# model tests, which cannot see any of it; these ran only when someone typed `make drive`.
#
# Weekly rather than per push: two dozen editor starts, a sandbox child, a BEAM node and two
# language servers take a while, and what they catch moves slowly. Each driver runs on its own
# (tools/ci/drive-all.sh), so one red driver does not hide the rest; every log is uploaded.
# A workflow of its own so a push to main (ci.yml's concurrency group) never cancels it.

on:
  workflow_dispatch:
  # Sunday 05:00 UTC, after ci.yml's weekly full run.
  schedule:
    - cron: "0 5 * * 0"

concurrency:
  group: drive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drive:
    name: live drivers (ubuntu, headless)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      # The brood built against: `last-green`, as ci.yml's gate tracks it.
      BROOD_REF: last-green
    steps:
      # drive-git-rebase plans an interactive rebase from HEAD~2 of this checkout (and
      # cancels it): a depth-1 clone has no HEAD~2
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/checkout@v4
        with:
          repository: broodlang/brood
          ref: ${{ env.BROOD_REF }}
          path: .brood
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .brood
          cache-on-failure: true
      # drive-elixir evaluates in a real BEAM node (Elixir 1.14+); without one it skips
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"
      - name: the gui's libraries (nest is built with the gui, as everywhere else)
        run: bash .brood/scripts/ci/install-gui-deps.sh
      - name: Build nest with the gui
        working-directory: .brood
        run: cargo build -p nest --features brood/gui --features brood/treesit-grammars
      # drive-lsp starts two real brood-lsp servers; without one on PATH it skips
      - name: Build brood-lsp
        working-directory: .brood
        run: cargo build -p brood-lsp
      - name: a git identity (the git drivers commit in throwaway repositories)
        run: |
          git config --global user.name "bedit drivers"
          git config --global user.email "drivers@bedit.invalid"
          git config --global init.defaultBranch main
      - name: every driver, each on its own
        timeout-minutes: 100
        env:
          DRIVE_TIMEOUT_S: "600"
        run: bash tools/ci/drive-all.sh .brood/target/debug/nest drive-out
      - name: upload the drivers' logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: drive-logs
          path: drive-out
          if-no-files-found: warn
