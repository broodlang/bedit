name: CI

# Thin caller. The gate itself — build brood, `nest check`, `nest format --check`,
# `nest test` — lives once in broodlang/brood/.github/workflows/package-ci.yml, so a
# change to what "green" means is one edit rather than one per repo.
#
# It tracks brood `main` on purpose: a package pinned by git ref with no CI is a package
# whose breakage is found by whoever deploys it, which is how hatch stayed broken across
# two releases. It builds brood's `last-green` — the newest main commit whose own CI passed
# every job (brood's ci.yml advances it) — so it follows main within one green brood run,
# and a main that does not build (2026-11-11, a deleted file still embedded) reddens brood
# and not bedit. A bedit change that needs a brood change waits for that run to go green.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The weekly full run: the same jobs plus what per push leaves out to stay quick (the
  # whole-project checker on macOS and Windows, PLATFORM_CHECK below). Sunday 04:00 UTC,
  # after brood's own full run.
  schedule:
    - cron: "0 4 * * 0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: broodlang/brood/.github/workflows/package-ci.yml@main
    with:
      brood-ref: last-green
      # The suite is ~4 minutes in one job; four shards side by side keep each under two
      # (brood's package-ci, `nest test --partitions 4 --shard K`; three left one at 3 minutes).
      test-partitions: 4

  # macOS and Windows: the OSes bedit's design claims to avoid Emacs's per-platform bugs on
  # (paths, CRLF, the clipboard, keys, fonts, spawning, home directories), which the gate
  # above — Linux only — never runs on. A `nest` built from brood for THAT OS, with the gui,
  # runs the boot check and the platform smoke set (and `nest check`, in the weekly run)
  # (tools/ci/platform-smoke.sh says what each file is there for). Built rather than
  # downloaded: brood's CI keeps no nest per OS, and the target directory is cached here, so
  # a run after the first rebuilds only what brood changed.
  platform-smoke:
    name: platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    env:
      CARGO_TERM_COLOR: always
      # The brood built against: `last-green`, as the gate above tracks it.
      BROOD_REF: last-green
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: broodlang/brood
          ref: ${{ env.BROOD_REF }}
          path: .brood
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .brood
          cache-on-failure: true
      - name: Build nest with the gui
        working-directory: .brood
        run: cargo build -p nest --features brood/gui --features brood/treesit-grammars
      - name: the boot check and the platform smoke set (headless; nest check weekly)
        shell: bash
        env:
          PLATFORM_CHECK: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
        run: bash tools/ci/platform-smoke.sh .brood/target/debug/nest
      # The REAL window: everything above is headless. bedit started through `main` on a file
      # in a window on the runner's own desktop (macOS's logged-in session, Windows's
      # interactive one), typed into, saved, the file read back and the window captured
      # (tools/ci/real-window.sh / .blsp). The OS's own input (System Events, SendKeys) is
      # REQUIRED: the driver types only once the bedit window is in front (asked again until
      # it is, up to 30 s) and waits for the file. Its four "NOT proven" runs on each OS
      # (2026-11-09) were the driver looking for the word at the file's start, though the
      # keys land at point — fixed that day, every run since typed and saved. Runs after a
      # failed smoke step too, so one red run says both.
      - name: the real window (typed into, saved, captured)
        if: ${{ !cancelled() }}
        shell: bash
        timeout-minutes: 12
        env:
          REAL_WINDOW_OS_INPUT: require
          REAL_WINDOW_TIMEOUT_MS: "540000"
        run: bash tools/ci/real-window.sh .brood/target/debug/nest real-window-out desktop
      - name: upload the real window's pictures and log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: real-window-${{ matrix.os }}
          path: real-window-out
          if-no-files-found: warn
      # The step above runs under Git Bash, which sets HOME and puts `sh` on PATH — neither
      # of which a Windows desktop launch has. Here: PowerShell, HOME unset (so the home is
      # USERPROFILE's) and Git's `sh` off PATH, over the files that spawn a shell, resolve
      # the home or write under it.
      - name: Windows as a desktop launch has it (pwsh, no HOME, no sh)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BROOD_GUI_HEADLESS: "1"
        run: |
          Remove-Item Env:HOME -ErrorAction SilentlyContinue
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch '\\Git\\(usr\\)?bin' -and $_ -notmatch '\\(msys64|mingw64)' }) -join ';'
          if ($env:HOME) { throw "HOME is still set: $env:HOME" }
          $sh = Get-Command sh -ErrorAction SilentlyContinue
          if ($sh) { throw "sh is still on PATH: $($sh.Source)" }
          $env:BSHELL_HISTORY = Join-Path $env:RUNNER_TEMP 'bshell-history.blsp'
          $nest = Resolve-Path .brood/target/debug/nest.exe
          & $nest run --check-boot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $nest test tests/shell_command_test.blsp tests/bshell_test.blsp tests/compile_test.blsp tests/platform_test.blsp tests/recover_test.blsp tests/startup_test.blsp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # The LSP client against a REAL language server, which the gate above only ever meets as a
  # stand-in answering canned results: rust-analyzer on tools/ci/fixtures/lens-fixture, its
  # inlay hints, semantic tokens (and a delta after an edit), code lenses (resolved, moved
  # with the text), its refresh requests, and a lens click that runs `cargo run` and jumps to
  # an impl (tools/ci/lsp-rust.sh / .blsp). Headless: no display, the editor's own loop over
  # a scripted frontend.
  lsp-rust-analyzer:
    name: lsp against rust-analyzer (ubuntu)
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      BROOD_REF: last-green
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: broodlang/brood
          ref: ${{ env.BROOD_REF }}
          path: .brood
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-analyzer
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .brood
          cache-on-failure: true
      - name: the gui's libraries (nest is built with the gui, as everywhere else)
        run: bash .brood/scripts/ci/install-gui-deps.sh
      - name: Build nest with the gui
        working-directory: .brood
        run: cargo build -p nest --features brood/gui --features brood/treesit-grammars
      - name: inlay hints, semantic tokens and code lenses against rust-analyzer
        timeout-minutes: 10
        env:
          LSP_RUST_DEADLINE_MS: "420000"
        run: bash tools/ci/lsp-rust.sh .brood/target/debug/nest

  # Linux's real window, which the gate above (headless, brood's package-ci) never opens: the
  # same check as `platform-smoke`'s, under a private Xvfb — typed into through X11's own
  # input too (xdotool's XTEST, required: nothing on Xvfb refuses it) — and under a headless
  # Weston, so the Wayland backend opens, paints and takes keys from the loop as well.
  real-window-linux:
    name: real window (ubuntu, X11 and Wayland)
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      BROOD_REF: last-green
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: broodlang/brood
          ref: ${{ env.BROOD_REF }}
          path: .brood
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .brood
          cache-on-failure: true
      - name: the gui's libraries, and the displays to open a window on
        run: |
          bash .brood/scripts/ci/install-gui-deps.sh
          # winit dlopens libxkbcommon-x11 for an X11 window; without it the gui thread panics at start
          sudo apt-get install -y --no-install-recommends xvfb xauth xdotool weston libxkbcommon-x11-0
      - name: Build nest with the gui
        working-directory: .brood
        run: cargo build -p nest --features brood/gui --features brood/treesit-grammars
      - name: the real window under X11 (Xvfb; loop input and xdotool)
        timeout-minutes: 10
        env:
          # required: xdotool's keys go through XTEST to the focused window, as a keyboard's
          # (tools/ci/real-window.blsp's `linux-os-input-script` says why never one chained call)
          REAL_WINDOW_OS_INPUT: require
          REAL_WINDOW_TIMEOUT_MS: "480000"
        run: bash tools/ci/real-window.sh .brood/target/debug/nest real-window-out/x11 x11
      - name: the real window under Wayland (headless Weston; loop input)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          REAL_WINDOW_TIMEOUT_MS: "480000"
        run: bash tools/ci/real-window.sh .brood/target/debug/nest real-window-out/wayland wayland
      # timed, so here and never on a desktop: a frame of a 20k-line Markdown buffer under each
      # wrap-prefix style, scrolled; fails over a generous budget, prints the timings
      - name: the wrap prefix's cost in a large Markdown buffer (timed)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          BEDIT_PERF_CHECK: "1"
          BROOD_GUI_HEADLESS: "1"
        run: .brood/target/debug/nest test tests/wrap_perf_test.blsp
      - name: upload the real window's pictures and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: real-window-linux
          path: real-window-out
          if-no-files-found: warn

  # `/ssh:` editing against a REAL sshd, which the gate above (ssh stood in for by a script,
  # tests/sshedit_test.blsp) never reaches: OpenSSH's server on localhost on a high port with a
  # throwaway host key and config, run as root through sudo so it can check a password, a
  # throwaway user for that password login, and ssh host aliases in ~/.ssh/config for a key
  # login, a host only reachable through a jump host and one whose key is not known. The driver
  # (tools/ci/ssh-real.sh / .blsp) opens, edits, saves (atomic, size and SHA-256 checked),
  # reverts, opens a binary as hex and a large file after asking, lists a directory for the
  # prompt and in dired (visit, make, move, copy, delete), opens `~user/…`, goes through a
  # jump host, refuses the unknown host key, logs in with a password through SSH_ASKPASS, edits a
  # root-only file through the `|sudo:`, `|su:` and `|doas:` hops (with and without a password,
  # and again with sudo-rs as the host's sudo), and says a connection dropped when sshd is
  # killed mid-session.
  ssh-real:
    name: real sshd (ubuntu)
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      BROOD_REF: last-green
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: broodlang/brood
          ref: ${{ env.BROOD_REF }}
          path: .brood
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .brood
          cache-on-failure: true
      - name: the gui's libraries (bedit loads them) and OpenSSH's server
        run: |
          bash .brood/scripts/ci/install-gui-deps.sh
          sudo apt-get install -y --no-install-recommends openssh-server openssh-client doas
      - name: Build nest with the gui
        working-directory: .brood
        run: cargo build -p nest --features brood/gui --features brood/treesit-grammars
      - name: "/ssh: editing against a real sshd on localhost"
        timeout-minutes: 10
        env:
          BROOD_GUI_HEADLESS: "1"
        run: bash tools/ci/ssh-real.sh .brood/target/debug/nest ssh-real-out ci
      # sudo-rs as the host's sudo (Ubuntu 25.10+ ships it as `sudo`): Ubuntu 24.04's own
      # package (0.2.2 — before `-p` and SUDO_PROMPT, which refuse the whole command over `-p`)
      # and the latest release from crates.io. Each is installed setuid as /usr/local/bin/sudo
      # for one run of the root hops' checks, the system's sudo left as it is.
      - name: sudo-rs, Ubuntu's and the latest
        timeout-minutes: 10
        run: |
          sudo apt-get install -y --no-install-recommends sudo-rs libpam0g-dev
          cargo install sudo-rs --locked --root "$RUNNER_TEMP/sudo-rs-latest"
      - name: "/ssh:…|sudo: with Ubuntu's sudo-rs (0.2.2) as the host's sudo"
        timeout-minutes: 10
        env:
          BROOD_GUI_HEADLESS: "1"
          BEDIT_SSH_ONLY: root
          BEDIT_SSH_SUDO: /usr/bin/sudo-rs
        run: bash tools/ci/ssh-real.sh .brood/target/debug/nest ssh-real-out/sudo-rs-ubuntu ci
      - name: "/ssh:…|sudo: with the latest sudo-rs as the host's sudo"
        timeout-minutes: 10
        env:
          BROOD_GUI_HEADLESS: "1"
          BEDIT_SSH_ONLY: root
        run: |
          BEDIT_SSH_SUDO="$RUNNER_TEMP/sudo-rs-latest/bin/sudo" \
            bash tools/ci/ssh-real.sh .brood/target/debug/nest ssh-real-out/sudo-rs-latest ci
      - name: upload the driver's and sshd's logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ssh-real
          path: ssh-real-out
          if-no-files-found: warn
